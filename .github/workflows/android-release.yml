name: Build & Release Split APKs

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        id: decode_keystore
        run: |
          echo "$KEYSTORE_FILE" | base64 -d > my-release-key.jks
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build signed split APKs
        run: ./gradlew :app:assembleRelease
        env:
          ORG_GRADLE_PROJECT_storeFile: my-release-key.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Find APKs
        id: find_apks
        run: |
          echo "APK_V7=$(find app/release -name '*armeabi-v7a-release.apk' | head -n1)" >> $GITHUB_ENV
          echo "APK_V8=$(find app/release -name '*arm64-v8a-release.apk' | head -n1)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Automated Release ${{ github.sha }}'
          tag_name: 'temp-${{ github.sha }}'
          files: |
            ${{ env.APK_V7 }}
            ${{ env.APK_V8 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
